# TEMPORARY verification for this branch — removed again right after it has run.
#
# The authoring sandbox had no JDK / Android SDK, so the changes could not be compiled there.
# GitHub-hosted runners have both, so this workflow does what could not be done locally:
#   job "branch":   compile + unit tests + the real R8 release build + a scan of the final DEX
#                   for the Android 15-deprecated window APIs that Play Console flags
#   job "baseline": the same DEX scan for the code as it was before these changes (R8 off)
# No secrets are used. Release signing uses a throw-away key created inside the job
# (never the repository's upload key).
name: verify-build

on:
  push:
    branches:
      - "arena/01a0f3b0-emf-sentinel"

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

env:
  STORE_PASSWORD: ci-verify-pass
  KEY_PASSWORD: ci-verify-pass
  BASELINE_SHA: 72eed5ce1d0a938b715e5b5dff776f1fb887c339

jobs:
  branch:
    name: branch (this change)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Prepare (Gradle heap, SDK licences, throw-away signing key)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-verify.jks" -alias upload \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=ci-verify"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-verify.jks" >> "$GITHUB_ENV"

      - name: "1. Compile + assemble debug"
        id: debug
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: "2. Unit tests (debug) incl. the new AdUnitConfigTest"
        id: unit
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: "3. AdUnitConfigTest on the qa + release variants (also compiles both)"
        id: variants
        continue-on-error: true
        run: >-
          gradle --no-daemon --stacktrace
          :app:testQaUnitTest --tests com.example.AdUnitConfigTest
          :app:testReleaseUnitTest --tests com.example.AdUnitConfigTest

      - name: "4. Release build with R8 + resource shrinking (incl. lint-vital)"
        id: release
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: "5. Resolved androidx.fragment on the release runtime classpath"
        id: fragment
        continue-on-error: true
        run: >-
          gradle --no-daemon :app:dependencyInsight
          --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath

      - name: "6. DEX scan of the R8 release APK"
        id: scan
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: >-
          python3 .github/ci/dex_scan.py "THIS BRANCH (R8 on)"
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/mapping/release/mapping.txt

      - name: "7. R8 usage.txt / mapping.txt: androidx.activity shims removed?"
        id: usage
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          D=app/build/outputs/mapping/release
          ls -l "$D"
          echo "EdgeToEdgeApi* entries REMOVED (usage.txt):  $(grep -c 'EdgeToEdgeApi' "$D/usage.txt" || true)"
          echo "EdgeToEdgeApi* entries KEPT    (mapping.txt): $(grep -c 'EdgeToEdgeApi' "$D/mapping.txt" || true)"
          echo "WindowCompat.enableEdgeToEdge kept in mapping.txt: $(grep -c 'enableEdgeToEdge' "$D/mapping.txt" || true)"
          ls -l app/build/outputs/apk/release/ app/build/outputs/apk/debug/ || true

      - name: Result summary
        if: always()
        run: |
          echo "debug build ............ ${{ steps.debug.outcome }}"
          echo "unit tests (debug) ..... ${{ steps.unit.outcome }}"
          echo "qa/release guard test .. ${{ steps.variants.outcome }}"
          echo "release (R8) build ..... ${{ steps.release.outcome }}"
          echo "fragment insight ....... ${{ steps.fragment.outcome }}"
          echo "dex scan ............... ${{ steps.scan.outcome }}"
          echo "R8 usage check ......... ${{ steps.usage.outcome }}"
          test "${{ steps.debug.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.variants.outcome }}" = success
          test "${{ steps.release.outcome }}" = success

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: branch-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  baseline:
    name: baseline (before this change, R8 off)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this branch (for the scan script only)
        uses: actions/checkout@v4
        with:
          path: branch

      - name: Checkout the baseline commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Prepare (Gradle heap, SDK licences, throw-away signing key)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-verify.jks" -alias upload \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=ci-verify"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-verify.jks" >> "$GITHUB_ENV"

      - name: "Baseline release build (R8 off, as shipped in 3.3)"
        run: gradle --no-daemon --stacktrace -p baseline :app:assembleRelease

      - name: "Baseline fragment resolution"
        continue-on-error: true
        run: >-
          gradle --no-daemon -p baseline :app:dependencyInsight
          --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath

      - name: "DEX scan of the baseline release APK"
        run: >-
          python3 branch/.github/ci/dex_scan.py "BASELINE (main before these changes, R8 off)"
          baseline/app/build/outputs/apk/release/app-release.apk
