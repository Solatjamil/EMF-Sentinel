# TEMPORARY verification for this branch - removed again right after it has run.
#
# The authoring sandbox had no JDK / Android SDK, so the changes could not be compiled there.
# GitHub-hosted runners have both, so this workflow does what could not be done locally:
#   job "branch":   compile, unit tests, the real R8 release build, a scan of the final DEX for the
#                   Android 15-deprecated window APIs that Play Console flags, and full lint
#   job "baseline": the same DEX scan + unit tests for the code as it was before these changes
#   job "smoke":    the R8 release build (built with Google DEMO ad ids) launched on API 35 + 36
#                   emulators: does it survive, does the native ad load, are insets applied?
# No secrets are used. Release signing uses throw-away keys created inside the job (never the
# repository's upload key). Every step reports through workflow annotations (.github/ci/digest.py)
# because the authoring sandbox can read annotations but not raw logs or artifacts.
name: verify-build

on:
  push:
    branches:
      - "arena/01a0f3b0-emf-sentinel"

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

env:
  STORE_PASSWORD: ci-verify-pass
  KEY_PASSWORD: ci-verify-pass
  BASELINE_SHA: 72eed5ce1d0a938b715e5b5dff776f1fb887c339
  LOGS: /tmp/ci-logs

jobs:
  branch:
    name: branch (this change)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Prepare (Gradle heap, SDK licences, throw-away signing keys)
        run: |
          mkdir -p ~/.gradle "$LOGS"
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-verify.jks" -alias upload \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=ci-verify"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-verify.jks" >> "$GITHUB_ENV"
          # build.gradle.kts signs DEBUG builds with ./debug.keystore, which is .gitignored and so
          # missing on every fresh checkout (pre-existing, untouched by this change).
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: "1. Compile + assemble debug"
        id: debug
        continue-on-error: true
        run: bash .github/ci/run_step.sh debug gradle gradle --no-daemon --stacktrace :app:assembleDebug

      - name: "2. Unit tests (debug), all of them"
        id: unit
        continue-on-error: true
        run: bash .github/ci/run_step.sh unit gradle gradle --no-daemon :app:testDebugUnitTest

      - name: "2b. JUnit results (debug)"
        if: always()
        run: python3 .github/ci/digest.py junit "debug" app/build/test-results/testDebugUnitTest

      - name: "3. BuildConfig per variant: which ad ids does each build carry? (+ guard test on release)"
        id: variants
        continue-on-error: true
        run: bash .github/ci/run_step.sh variants full bash .github/ci/variants_check.sh

      - name: "3b. JUnit results (release guard test)"
        if: always()
        run: python3 .github/ci/digest.py junit "release" app/build/test-results/testReleaseUnitTest

      - name: "4. Release build with R8 + resource shrinking (incl. lint-vital)"
        id: release
        continue-on-error: true
        run: bash .github/ci/run_step.sh release gradle gradle --no-daemon --stacktrace :app:assembleRelease

      - name: "4b. Release APK facts (version, SDK levels, AdMob app id in the packaged manifest)"
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: bash .github/ci/run_step.sh apkfacts full bash .github/ci/apk_facts.sh

      - name: "4c. App bundle (what Play receives): builds, and embeds the R8 mapping?"
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: bash .github/ci/run_step.sh bundle full bash .github/ci/bundle_check.sh

      - name: "5. Resolved androidx.fragment on the release runtime classpath"
        id: fragment
        continue-on-error: true
        run: >-
          bash .github/ci/run_step.sh fragment full
          gradle --no-daemon :app:dependencyInsight
          --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath

      - name: "6. DEX scan of the R8 release APK"
        id: scan
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: >-
          bash .github/ci/run_step.sh dexscan full
          python3 .github/ci/dex_scan.py "THIS BRANCH (R8 on)"
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/mapping/release/mapping.txt

      - name: "7. R8: were the unused androidx.activity shims removed?"
        id: usage
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: bash .github/ci/run_step.sh usage full bash .github/ci/usage_check.sh

      - name: "8. Full lint (release): Play SDK Index, NewApi, deprecated-API checks"
        id: lint
        continue-on-error: true
        run: bash .github/ci/run_step.sh lint gradle gradle --no-daemon :app:lintRelease

      - name: "8b. Lint findings"
        if: always()
        run: python3 .github/ci/digest.py lint app/build/reports/lint-results-release.xml

      - name: Result summary
        if: always()
        run: |
          S="debug=${{ steps.debug.outcome }} unit=${{ steps.unit.outcome }} variants=${{ steps.variants.outcome }} release=${{ steps.release.outcome }} fragment=${{ steps.fragment.outcome }} dexscan=${{ steps.scan.outcome }} usage=${{ steps.usage.outcome }} lint=${{ steps.lint.outcome }}"
          echo "$S"
          echo "::notice title=branch outcomes (continue-on-error hides these in the UI)::$S"
          test "${{ steps.debug.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.variants.outcome }}" = success
          test "${{ steps.release.outcome }}" = success

  baseline:
    name: baseline (before this change, R8 off)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this branch (for the CI scripts only)
        uses: actions/checkout@v4
        with:
          path: branch

      - name: Checkout the baseline commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Prepare (Gradle heap, SDK licences, throw-away signing keys)
        run: |
          mkdir -p ~/.gradle "$LOGS"
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-verify.jks" -alias upload \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=ci-verify"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-verify.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/baseline/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: "Baseline release build (R8 off, as shipped in 3.3)"
        run: bash branch/.github/ci/run_step.sh b_release gradle gradle --no-daemon --stacktrace -p baseline :app:assembleRelease

      - name: "Baseline fragment resolution"
        continue-on-error: true
        run: >-
          bash branch/.github/ci/run_step.sh b_fragment full
          gradle --no-daemon -p baseline :app:dependencyInsight
          --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath

      - name: "DEX scan of the baseline release APK"
        run: >-
          bash branch/.github/ci/run_step.sh b_dexscan full
          python3 branch/.github/ci/dex_scan.py "BASELINE (main before these changes, R8 off)"
          baseline/app/build/outputs/apk/release/app-release.apk

      - name: "Baseline unit tests (all): which failures pre-date this change?"
        continue-on-error: true
        run: bash branch/.github/ci/run_step.sh b_unit gradle gradle --no-daemon -p baseline :app:testDebugUnitTest

      - name: "Baseline JUnit results"
        if: always()
        run: python3 branch/.github/ci/digest.py junit "BASELINE debug" baseline/app/build/test-results/testDebugUnitTest

  smoke:
    name: "smoke (R8 release + demo ads, emulator API ${{ matrix.api }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Prepare (Gradle heap, SDK licences, throw-away signing key)
        run: |
          mkdir -p ~/.gradle "$LOGS"
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-verify.jks" -alias upload \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=ci-verify"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-verify.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "Build the R8 release APK with Google DEMO ad ids (CI must never request live ads)"
        run: >-
          bash .github/ci/run_step.sh smoke_build gradle
          gradle --no-daemon :app:assembleRelease
          -PADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
          -PADMOB_BANNER_UNIT_ID=ca-app-pub-3940256099942544/9214589741
          -PADMOB_NATIVE_UNIT_ID=ca-app-pub-3940256099942544/2247696110

      - name: "Build the plain (no R8) debug APK to tell R8 effects from everything else"
        run: bash .github/ci/run_step.sh smoke_build_debug gradle gradle --no-daemon :app:assembleDebug

      - name: Emulator smoke test
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # google_apis_playstore, not google_apis: Google's demo NATIVE creatives are app-install ads whose
          # click actions need the Play Store; without it the SDK answers "Incorrect native ad response.
          # Click actions were not properly specified" (error 0) - seen on the first run.
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          script: bash .github/ci/smoke.sh

      - name: "Smoke digest: R8 release build"
        if: always()
        run: python3 .github/ci/digest.py smoke "API ${{ matrix.api }} release(R8)" "$LOGS/smoke/release"

      - name: "Smoke digest: plain debug build"
        if: always()
        run: python3 .github/ci/digest.py smoke "API ${{ matrix.api }} debug" "$LOGS/smoke/debug"
